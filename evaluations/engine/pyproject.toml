[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "em-taskflow-evaluations"
version = "0.1.0"
description = "EM TaskFlow AI Modular Evaluation Engine (Ragas, DeepEval, Pairwise Arena, Langfuse)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "temporalio==1.6.0",
    "langfuse>=2.50.0",
    "ragas>=0.1.15",
    "deepeval>=1.4.0",
    "datasets>=2.18.0",
    "litellm>=1.30.0",
    "pandas==2.2.1",
    "scipy>=1.11.0",
    "ollama>=0.1.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-ollama>=0.1.0",
    "httpx==0.27.0",
    "pytest==8.0.2",
    "pytest-asyncio==0.23.5",
    "python-dotenv>=1.0.0",
    "tabulate==0.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["evals*", "temporal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
