[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# -p no:plugins disables deepeval's auto-loaded pytest plugin ("plugins" = deepeval.plugins.plugin),
# which imports deepeval telemetry before conftest.py can opt out. See tests/conftest.py.
addopts = -v --tb=short -p no:plugins
