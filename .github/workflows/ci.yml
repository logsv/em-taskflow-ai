name: Main CI Orchestrator

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  check-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      python_ai: ${{ steps.changes.outputs.python_ai }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            python_ai:
              - 'services/python-ai-service/**'

  backend-ci:
    needs: check-changes
    if: needs.check-changes.outputs.backend == 'true' || needs.check-changes.outputs.python_ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx tsc -p tsconfig.test.json
      - run: npm test
      - run: npm run evaluate