name: Main CI Orchestrator

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  check-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      python_ai: ${{ steps.changes.outputs.python_ai }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/ci/**'
            python_ai:
              - 'services/python-ai-service/**'

  backend-ci:
    needs: check-changes
    if: needs.check-changes.outputs.backend == 'true' || needs.check-changes.outputs.python_ai == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      CI: true
      NODE_ENV: test
      CI_MODE: true
      OLLAMA_AVAILABLE: false
      CHROMA_AVAILABLE: false
      GOOGLE_OAUTH_AVAILABLE: false
      MCP_CALENDAR_AVAILABLE: false
      MCP_NOTION_AVAILABLE: false
      MCP_JIRA_AVAILABLE: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Run Node Unit Tests
        id: unit-tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/backend-unit.log"
      - name: Cache Ollama Models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-hermes3-8b-v1
          restore-keys: |
            ollama-hermes3-8b-
      - name: Install & Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          echo "Waiting for Ollama daemon to initialize..."
          while ! curl -s http://localhost:11434/api/tags > /dev/null; do
            sleep 1
          done
          echo "✅ Ollama is ready!"
          ollama pull hermes3:8b
      - name: Run Evaluation Suite Gate
        id: evaluate
        run: |
          # Remove any stale report so the summary only ever reads this run's output.
          rm -f ../reports/evaluations/composite_latest.json
          npm run evaluate
        env:
          OLLAMA_AVAILABLE: true
          CI_MODE: false
      - name: Display CI Summary
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit-tests.outcome }}
          EVAL_OUTCOME: ${{ steps.evaluate.outcome }}
        run: |
          python3 ../scripts/ci/ci_summary.py backend \
            --unit-log "$RUNNER_TEMP/backend-unit.log" \
            --unit-outcome "$UNIT_OUTCOME" \
            --coverage-summary coverage/coverage-summary.json \
            --eval-report ../reports/evaluations/composite_latest.json \
            --eval-outcome "$EVAL_OUTCOME" | tee -a "$GITHUB_STEP_SUMMARY"

  python-ai-ci:
    needs: check-changes
    if: needs.check-changes.outputs.python_ai == 'true' || needs.check-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/python-ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: curl -fsSL https://astral.sh/uv/install.sh | sh
      - name: Install Python dependencies
        run: $HOME/.local/bin/uv sync
      - name: Cache Ollama Models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-hermes3-8b-v1
          restore-keys: |
            ollama-hermes3-8b-
      - name: Install & Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          echo "Waiting for Ollama daemon to initialize..."
          while ! curl -s http://localhost:11434/api/tags > /dev/null; do
            sleep 1
          done
          echo "✅ Ollama is ready!"
          ollama pull hermes3:8b
      - name: Run Python Pytest Specs
        id: pytest
        run: |
          set -o pipefail
          $HOME/.local/bin/uv run pytest 2>&1 | tee "$RUNNER_TEMP/pytest.log"
        env:
          OLLAMA_BASE_URL: http://localhost:11434
      - name: Display Python AI Test Summary
        if: always()
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          python3 ../../scripts/ci/ci_summary.py python \
            --pytest-log "$RUNNER_TEMP/pytest.log" \
            --pytest-outcome "$PYTEST_OUTCOME" | tee -a "$GITHUB_STEP_SUMMARY"
