name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Model-free checks only. LLM-judge evaluations need the local model
# (qwen3:8b-q8_0, ~9 GB) and run nightly on the owner's machine via
# scripts/run-nightly-eval.sh; tests that need a live judge skip with a reason.

jobs:
  backend:
    name: Backend (lint + tests on Postgres/Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskflow" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      npm_config_onnxruntime_node_install_cuda: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test

  python-ai-service:
    name: Python AI service (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/python-ai-service
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow_ai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskflow" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      OTEL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uvx ruff@0.8.4 check app evaluation tests
      - run: uv run --python 3.12 pytest

  eval-engine:
    name: Evaluation engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./evaluations/engine
    env:
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python 3.12 pytest -p no:plugins

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --legacy-peer-deps works around an npm 10 arborist crash on optional peers
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build
