name: Backend & AI Service CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'services/python-ai-service/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'services/python-ai-service/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-test-and-eval:
    name: Node Backend & Evaluation Suite
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    defaults:
      run:
        working-directory: ./backend
    
    env:
      CI: true
      NODE_ENV: test
      CI_MODE: true
      OLLAMA_AVAILABLE: false
      CHROMA_AVAILABLE: false
      GOOGLE_OAUTH_AVAILABLE: false
      MCP_CALENDAR_AVAILABLE: false
      MCP_NOTION_AVAILABLE: false
      MCP_JIRA_AVAILABLE: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install Node dependencies
      run: npm ci --legacy-peer-deps
    
    - name: Run Node Unit Tests (155 Specs)
      run: npm test
      continue-on-error: false

    - name: Cache Ollama Models
      uses: actions/cache@v4
      with:
        path: ~/.ollama
        key: ollama-hermes3-8b-v1
        restore-keys: |
          ollama-hermes3-8b-

    - name: Install & Start Ollama
      run: |
        curl -fsSL https://ollama.com/install.sh | sh
        ollama serve &
        echo "Waiting for Ollama daemon to initialize..."
        while ! curl -s http://localhost:11434/api/tags > /dev/null; do
          sleep 1
        done
        echo "✅ Ollama is ready!"
        ollama pull hermes3:8b

    - name: Run Evaluation Suite Gate
      run: npm run evaluate
      env:
        OLLAMA_AVAILABLE: true
        CI_MODE: false

    - name: Display Evaluation & Coverage Summary
      run: |
        echo "## 📊 CI & Evaluation Gate Summary" >> $GITHUB_STEP_SUMMARY
        echo "✅ Node.js backend unit specs (155 specs) passed with 0 failures." >> $GITHUB_STEP_SUMMARY
        echo "✅ Evaluation success gates completed with hermes3:8b." >> $GITHUB_STEP_SUMMARY

  python-ai-test:
    name: Python AI Service Specs
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./services/python-ai-service
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: curl -fsSL https://astral.sh/uv/install.sh | sh

    - name: Install Python dependencies
      run: $HOME/.local/bin/uv sync

    - name: Run Python Pytest Specs (25 Specs)
      run: $HOME/.local/bin/uv run pytest