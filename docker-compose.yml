services:
  python-ai-service:
    build: ./services/python-ai-service
    container_name: em-taskflow-python-ai
    environment:
      REST_PORT: 8000
      GRPC_PORT: 50051
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: taskflow_ai
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      TEMPORAL_HOST: ${TEMPORAL_HOST:-em-taskflow-temporal:7233}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-a4eeeb19-4a09-440b-a80e-4cc2d2b89c66}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-11d33cb9-7d44-42d0-8087-deb3d7b81aac}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      SENTRY_DSN: ${SENTRY_DSN:-https://c9ea2673ec5424cfa2cffaf0cb4ab760@o4511882439819264.ingest.us.sentry.io/4511882443227136}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-b935e749c388e8fe66cc799e29e782bb73f7NRAL}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-em-taskflow-python-ai}
      AXIOM_TOKEN: ${AXIOM_TOKEN:-xaat-8d0e2c12-a34d-4c18-89a6-2d7ec1ed8094}
      AXIOM_DATASET: ${AXIOM_DATASET:-emtaskflowai}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_VERSION: ${APP_VERSION:-em-taskflow-python-ai@1.0.0}
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - em-taskflow-net

  backend:
    build: ./backend
    container_name: em-taskflow-backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      RUNTIME_MODE: ${RUNTIME_MODE:-full}
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://taskflow:taskflow@postgres:5432/taskflow_backend
      PYTHON_AI_SERVICE_URL: http://python-ai-service:8000
      PYTHON_AI_GRPC_HOST: python-ai-service:50051
      TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal:7233}
      RAG_ENABLED: "true"
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-ollama}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-hermes3:8b}
      LLM_OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MCP_JIRA_ENABLED: "false"
      MCP_NOTION_ENABLED: "false"
      MCP_GOOGLE_ENABLED: "false"
      MCP_GITHUB_ENABLED: "true"
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-emtaskflow}
      PHOENIX_ENABLED: ${PHOENIX_ENABLED:-true}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-emtaskflow}
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006/v1/traces}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-a4eeeb19-4a09-440b-a80e-4cc2d2b89c66}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-11d33cb9-7d44-42d0-8087-deb3d7b81aac}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-b935e749c388e8fe66cc799e29e782bb73f7NRAL}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-em-taskflow-backend}
      NEW_RELIC_LOG: stdout
      NEW_RELIC_LOG_LEVEL: ${NEW_RELIC_LOG_LEVEL:-info}
      NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
      NEW_RELIC_APPLICATION_LOGGING_ENABLED: "true"
      NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      python-ai-service:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/app/data
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - em-taskflow-net

  frontend:
    build: ./frontend
    container_name: em-taskflow-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - em-taskflow-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: em-taskflow-postgres
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow_backend
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=top"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow_backend"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - em-taskflow-net

  redis:
    image: redis:7-alpine
    container_name: em-taskflow-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - em-taskflow-net

  analytics-db:
    image: postgres:16
    container_name: em-taskflow-analytics-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse_db
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse_db"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - em-taskflow-net

  langfuse:
    image: langfuse/langfuse:2
    container_name: em-taskflow-langfuse
    depends_on:
      analytics-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://langfuse:langfuse@analytics-db:5432/langfuse_db"
      NEXTAUTH_SECRET: "my-secret-key-for-local-langfuse"
      SALT: "my-salt-for-local-langfuse"
      NEXTAUTH_URL: "http://localhost:3001"
      TELEMETRY_ENABLED: "false"
    ports:
      - "3001:3000"
    networks:
      - em-taskflow-net

  vllm:
    image: vllm/vllm-openai:latest
    container_name: em-taskflow-vllm
    profiles: ["gpu"]
    command: >
      --model Qwen/Qwen2.5-3B-Instruct
      --host 0.0.0.0
      --port 8000
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - vllm_cache:/root/.cache/huggingface
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/models').status==200 else 1)\""]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - em-taskflow-net

  adminer:
    image: adminer:latest
    container_name: em-taskflow-adminer
    ports:
      - "8080:8080"
    networks:
      - em-taskflow-net


  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: em-taskflow-temporal
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=taskflow
      - POSTGRES_PWD=taskflow
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - em-taskflow-net

  temporal-ui:
    image: temporalio/ui:latest
    container_name: em-taskflow-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8233
    ports:
      - "8233:8080"
    depends_on:
      - temporal
    networks:
      - em-taskflow-net

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: em-taskflow-phoenix
    environment:
      - PHOENIX_SQL_DATABASE_URL=postgresql://taskflow:taskflow@postgres:5432/taskflow_phoenix
      - PHOENIX_PORT=6006
      - PHOENIX_HOST=0.0.0.0
      - PHOENIX_GRPC_PORT=4317
    volumes:
      - phoenix_data:/root/.phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - em-taskflow-net

  promptfoo:
    build: ./backend
    container_name: em-taskflow-promptfoo
    command: ["node", "src/scripts/promptfooServer.js"]
    environment:
      - PORT=15500
      - PROMPTFOO_PORT=15500
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    ports:
      - "15500:15500"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - em-taskflow-net

  trulens:
    build: ./services/python-ai-service
    container_name: em-taskflow-trulens
    command: ["python", "-m", "streamlit", "run", "--server.port=8501", "--server.address=0.0.0.0", "evaluation/trulens_dashboard_app.py"]
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
    ports:
      - "8501:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - em-taskflow-net



networks:
  em-taskflow-net:
    driver: bridge

volumes:
  backend_data:
  postgres_data:
  analytics_postgres_data:
  phoenix_data:
  vllm_cache:
