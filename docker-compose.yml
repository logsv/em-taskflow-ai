services:
  python-ai-service:
    build: ./services/python-ai-service
    container_name: em-taskflow-python-ai
    environment:
      REST_PORT: 8000
      GRPC_PORT: 50051
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-a4eeeb19-4a09-440b-a80e-4cc2d2b89c66}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-11d33cb9-7d44-42d0-8087-deb3d7b81aac}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    ports:
      - "8000:8000"
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - em-taskflow-net

  backend:
    build: ./backend
    container_name: em-taskflow-backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      RUNTIME_MODE: ${RUNTIME_MODE:-full}
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://taskflow:taskflow@postgres:5432/taskflow
      PYTHON_AI_SERVICE_URL: http://python-ai-service:8000
      PYTHON_AI_GRPC_HOST: python-ai-service:50051
      RAG_ENABLED: "true"
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-ollama}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-llama3.2:latest}
      LLM_OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MCP_JIRA_ENABLED: "false"
      MCP_NOTION_ENABLED: "false"
      MCP_GOOGLE_ENABLED: "false"
      MCP_GITHUB_ENABLED: "true"
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-em-taskflow-ai}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-a4eeeb19-4a09-440b-a80e-4cc2d2b89c66}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-11d33cb9-7d44-42d0-8087-deb3d7b81aac}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    depends_on:
      postgres:
        condition: service_healthy
      python-ai-service:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_data:/app/data
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - em-taskflow-net

  frontend:
    build: ./frontend
    container_name: em-taskflow-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - em-taskflow-net

  postgres:
    image: postgres:16
    container_name: em-taskflow-postgres
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - em-taskflow-net

  analytics-db:
    image: postgres:16
    container_name: em-taskflow-analytics-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse_db
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse_db"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - em-taskflow-net

  langfuse:
    image: langfuse/langfuse:2
    container_name: em-taskflow-langfuse
    depends_on:
      analytics-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://langfuse:langfuse@analytics-db:5432/langfuse_db"
      NEXTAUTH_SECRET: "my-secret-key-for-local-langfuse"
      SALT: "my-salt-for-local-langfuse"
      NEXTAUTH_URL: "http://localhost:3001"
      TELEMETRY_ENABLED: "false"
    ports:
      - "3001:3000"
    networks:
      - em-taskflow-net

  vllm:
    image: vllm/vllm-openai:latest
    container_name: em-taskflow-vllm
    profiles: ["gpu"]
    command: >
      --model Qwen/Qwen2.5-3B-Instruct
      --host 0.0.0.0
      --port 8000
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - vllm_cache:/root/.cache/huggingface
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/models').status==200 else 1)\""]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - em-taskflow-net

  dozzle:
    image: amir20/dozzle:latest
    container_name: em-taskflow-dozzle
    ports:
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - em-taskflow-net

  adminer:
    image: adminer:latest
    container_name: em-taskflow-adminer
    ports:
      - "8080:8080"
    networks:
      - em-taskflow-net

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: em-taskflow-open-webui
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    ports:
      - "3080:8080"
    networks:
      - em-taskflow-net



networks:
  em-taskflow-net:
    driver: bridge

volumes:
  backend_data:
  postgres_data:
  analytics_postgres_data:
  vllm_cache:
